version: '3.9'
services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/smartworker
      - CLIENT_ORIGIN=http://localhost:3000
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
  web:
    build: ./frontend
    restart: unless-stopped
    env_file:
      - frontend/.env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - '3000:3000'
    depends_on:
      - api
volumes:
  mongo-data:
